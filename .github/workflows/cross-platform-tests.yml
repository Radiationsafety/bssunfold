# Cross-platform test matrix for bssunfold
# Tests Python 3.11–3.14 on Ubuntu, Windows, and macOS
name: Cross-platform tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    # Еженедельный прогон в воскресенье в 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch: # ручной запуск

permissions:
  contents: read

jobs:
  test:
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # не останавливать остальные при падении одного
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.15 исключён: у numpy/scipy/pandas/matplotlib/numba/llvmlite/
        # cvxpy/osqp/highspy/pymoo в uv.lock нет cp315-wheels (только сборка
        # из sdist, для scipy нужен системный BLAS), numba 0.65.1 (pymc ->
        # pytensor) явно запрещает Python >=3.15, а tensorflow/pyqubo/cplex
        # cp315 не имеют ни в одной версии.  Вернуть после апгрейда lock.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true # понадобится снова для pre-release в matrix

    # .python-version (3.12) иначе перебивает matrix: uv sync/uv run пересоздают
    # .venv под запрошенную версию, поэтому все job'ы фактически гоняли 3.12.
    # Фиксируем UV_PYTHON на интерпретаторе, который выше поставил setup-python.
    - name: Use the matrix interpreter for uv
      shell: bash
      run: |
        if [ -n "$pythonLocation" ]; then
          echo "UV_PYTHON=$pythonLocation" >> "$GITHUB_ENV"
        else
          echo "UV_PYTHON=${{ matrix.python-version }}" >> "$GITHUB_ENV"
        fi

    - name: Install dependencies
      run: uv sync --group dev

    - name: Show installed packages
      run: uv run pip list
      shell: bash

    - name: Lint with ruff
      # E9/F63/F7/F82 (syntax & error-level checks) are included in the
      # project's ruff rule set ("E", "F"); the strict gate also lives in
      # python-package.yml. Kept here so every matrix job fails fast.
      run: uv run ruff check --output-format=github src/ tests/
      shell: bash

    - name: Test with pytest
      run: |
        uv run pytest -v --tb=short --junitxml=junit-${{ matrix.os }}-${{ matrix.python-version }}.xml
      shell: bash

    - name: Upload test results (JUnit)
      if: always()
      # The artifact store (twirp CreateArtifact) intermittently times out on
      # GitHub-hosted runners (e.g. run 38905057627, macos/3.12). The upload is
      # diagnostic only — pytest already passed in this step's job — so a lost
      # JUnit file must not fail the matrix.
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: junit-${{ matrix.os }}-${{ matrix.python-version }}
        path: junit-${{ matrix.os }}-${{ matrix.python-version }}.xml
        if-no-files-found: warn
        retention-days: 14

  # Сводка результатов матрицы
  summary:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Collect matrix results
      run: |
        echo "## Cross-platform test results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Matrix completed** — see individual job logs for details." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Platform | Python 3.11 | Python 3.12 | Python 3.13 | Python 3.14 |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------------|-------------|-------------|-------------|" >> $GITHUB_STEP_SUMMARY
        echo "| Ubuntu   | ✅ | ✅ | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| Windows  | ✅ | ✅ | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| macOS    | ✅ | ✅ | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "> ℹ️  Python 3.15 пока вне matrix: в uv.lock нет cp315-wheels" >> $GITHUB_STEP_SUMMARY
        echo "> для части зависимостей (см. комментарий в matrix выше)." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "> ⚠️  Статусы в таблице — статические. Реальный статус каждого job" >> $GITHUB_STEP_SUMMARY
        echo "> смотрите в секции **test** выше." >> $GITHUB_STEP_SUMMARY