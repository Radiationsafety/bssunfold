[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pydata-sphinx-theme>=0.16.1",
    "pytest>=9.0.3",
    "pytest-cov>=6.1.0",
    "sphinx>=9.0.4",
    "twine>=6.2.0",
    "uv-build>=0.9.18",
    "pip>=24.0",
    "troml>=0.4.1",
    "directory-tree>=1.0.0",
    "marimo>=0.19.0",
    "ruff>=0.14.10",
    "pandas-stubs>=2.2.3",
    "plotly>=6.5.0",
    "coverage>=7.13.1",
    "codacy-coverage>=1.3.11",
    "radon>=6.0.1",
    "grayskull>=2.9.2",
    "codemetapy>=3.0.3",
    "deptry>=0.24.0",
    "jupyter-book>=2.1.0",
    "ghp-import>=2.1.0",
    "ipywidgets>=8.1.8",
