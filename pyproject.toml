    "black>=26.3.0",
    "autopep8>=2.3.2",
    "qpsolvers>=4.10.0",
    "lmfit>=1.3.4",
    "odl>=1.0.0",
    "pytikhonov>=0.0.1",
    "mystic>=0.4.5",
    "z3-solver>=4.13.0",
    "pyscipopt>=6.0.0",
    "docplex>=2.28.0",
    "cplex>=22.1.0",
    "dynapyt>=4.1.0",
    "pip-audit>=2.10.1",
    "bandit>=1.9.4",
    "mealpy>=3.0.2",
    "pyoptexplain>=0.1.1",
    "pymc>=5.0.0",
    "arviz>=0.17.0",
    "pylint>=3.3.0",
    "vulture>=2.14",
    "sphinxcontrib-mermaid>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/Radiationsafety/bssunfold"
Issues = "https://github.com/Radiationsafety/bssunfold/issues"
Repository = "https://github.com/Radiationsafety/bssunfold.git"
Changelog = "https://github.com/Radiationsafety/bssunfold/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:odl_plugins"
markers = ["slow: marks tests as slow (deselect with '-k not slow')"]

[tool.coverage.run]
source = ["src/bssunfold"]
omit = [
    "*/tests/*",
    "*/__pycache__/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

# [tool.coverage.report]
# fail_under = 80  # минимальный процент coverage

[tool.bandit]
targets = ["src"]
recursive = true
exclude_dirs = ["tests", "docs", "examples", "addon", "graphify-out"]

[tool.pylint.main]
fail-under = 7.0
ignore = [
    "CVS",
    "addon",
    "docs",
    "dist",
    "examples",
    "graphify-out",
    "htmlcov",
]
# Only analyze the source package
module-naming-style = "snake_case"

[tool.pylint.message_control]
# Disable stylistic/convention checks that are not actionable for this
# scientific package (names, docstring style, refactor complexity that is
# intentional in numeric kernels). Errors, warnings and logical issues stay on.
disable = [
    "C0103",   # invalid-name
    "C0114",   # missing-module-docstring
    "C0115",   # missing-class-docstring
    "C0116",   # missing-function-docstring
    "C0121",   # singleton-comparison
    "C0301",   # line-too-long (handled by ruff/black)
    "C0302",   # too-many-lines
    "C0325",   # superfluous-parens
    "C0411",   # wrong-import-order (handled by ruff)
    "C0412",   # ungrouped-imports
    "C0413",   # wrong-import-position
    "C0415",   # import-outside-toplevel (lazy optional deps by design)
    "C1801",   # len-as-condition
    "E1101",   # no-member (numpy/ctypes false positives)
    "E1120",   # no-value-for-parameter (numpy overload false positives)
    "E1141",   # dict-iter-missing-items
    "R0901",   # too-many-ancestors
    "R0902",   # too-many-instance-attributes
    "R0903",   # too-few-public-methods
    "R0904",   # too-many-public-methods (Detector exposes many unfold_* by design)
    "R0911",   # too-many-return-statements
    "R0912",   # too-many-branches
    "R0913",   # too-many-arguments
    "R0914",   # too-many-locals
    "R0915",   # too-many-statements
    "R0916",   # too-many-boolean-expressions
    "R0917",   # too-many-positional-arguments (numeric solver signatures by design)
    "R1702",   # too-many-nested-blocks
    "R1732",   # consider-using-with
    "R0801",   # duplicate-code (repeated __all__ / boilerplate across modules)
    "W0102",   # dangerous-default-value (mutable default args by design)
    "W0107",   # unnecessary-pass
    "W0212",   # protected-access (tests reach into internals on purpose)
    "W0221",   # arguments-differ
    "W0223",   # abstract-method
    "W0603",   # global-statement (module-level availability flags by design)
    "W0613",   # unused-argument (interface-compatible signatures by design)
    "W0718",   # broad-exception-catch
    "W1203",   # logging-fstring-interpolation
]

[tool.pylint."messages output"]
score = "no"

[tool.pylint.reports]
output-format = "colorized"
reports = false

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 80
indent-width = 4

[tool.ruff.lint]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
publish-url = "https://upload.pypi.org/legacy/"


