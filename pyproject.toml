[project]
name = "bssunfold"
version = "0.17.1"
description = "Python package for neutron spectrum unfolding from measurements obtained with Bonner Sphere Spectrometer (BSS)"
readme = "README.md"
authors = [
    { name = "Konstantin Chizhov", email = "kchizhov@jinr.ru" },
    { name = "Alexei Chizhov", email = "chizhov@jinr.ru" },
    { name = "Dmitry Borschev", email = "bds.22@uni-dubna.ru" },
    { name = "Maria Akimochkina", email = "a.m.a.mos@yandex.ru" },
]
maintainers = [
  {name = "Konstantin Chizhov", email = "kchizhov@jinr.ru"}
]
keywords = [ "unfolding", "BSS", "ill-posed task", "inverse problem", "Bonner sphere spectrometer"]

requires-python = ">=3.11"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
license ="GPL-3.0-only"
license-files = ["LICENSE"]

dependencies = [
    "cvxpy[ecos]>=1.7.5",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=2.2.3",
    "pyzmq>=27.1.0",
    "scipy>=1.16.3",
]

[project.optional-dependencies]
# Optional algorithmic backends (imported lazily inside function bodies with try/except)
lmfit = [
    "lmfit>=1.3.4",
]
mlem = [
    "odl>=1.0.0",
]
tikhonov = [
    "pytikhonov>=0.0.1",
]
qpsolvers = [
    "qpsolvers>=4.10.0",
]
numba = [
    "numba>=0.65.1",
]
mystic = [
    "mystic>=0.4.5",
]
mealpy = [
    "mealpy>=3.0.2",
]
smt = [
    "z3-solver>=4.13.0",
]
scip = [
    "pyscipopt>=6.0.0",
]
docplex = [
    "docplex>=2.28.0",
    "cplex>=22.1.0",
]
interpret = [
    "pyoptexplain>=0.1.1",
]
mcmc = [
    "pymc>=5.0.0",
    "arviz>=0.17.0",
]

test = [
    "pytest>=9.0.3",
]
# All optional backends
all = [
    "bssunfold[lmfit]",
    "bssunfold[mlem]",
    "bssunfold[tikhonov]",
    "bssunfold[qpsolvers]",
    "bssunfold[numba]",
    "bssunfold[mystic]",
    "bssunfold[smt]",
    "bssunfold[scip]",
    "bssunfold[docplex]",
    "bssunfold[mealpy]",
    "bssunfold[interpret]",
    "bssunfold[mcmc]",
    "bssunfold[test]",
]
# Base set of QP solvers available on all platforms (including Windows)
solvers-core = [
    "qpsolvers[osqp,piqp,qpalm,ecos,scs,clarabel]>=4.10.0",
]
# ProxQP solver via proxsuite — NOT available on Windows
solvers-proxqp = [
    "proxsuite>=0.7.2",
]
# JAX-based solvers
solvers-jax = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "jaxopt>=0.8.0",
]
# All optional solvers (Unix/Linux/macOS only — includes proxsuite)
all-solvers = [
    "bssunfold[solvers-core]",
    "bssunfold[solvers-proxqp]",
    "bssunfold[solvers-jax]",
]
# Recommended for Windows users (all solvers except proxsuite)
windows = [
    "bssunfold[solvers-core]",
    "bssunfold[solvers-jax]",
]

[project.scripts]
bssunfold = "bssunfold:main"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

# [tool.hatch.build]
